# Named populations, each a complete astrogwb.populations.AnyPopulation: a
# model_name and that model's construction settings. A catalog picks one by
# reference -- population = "${populations.cosmological}".
#
# The redshift window is stated once, in [populations.cosmological]; any other
# population should `extends` it, so narrowing it narrows them all.

# Every population is the model "bns_coba"; the variants are its construction
# settings, documented on astrogwb.populations.BNSCobaPopulation.

# The population every catalog is drawn from.
# Isotropic inclination is always sampled.
[populations.cosmological]
model_name = "bns_coba"
mass_model = "uniform"
minimum_redshift = 0.35
maximum_redshift = 20.0
n_grid = 4096
