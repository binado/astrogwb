# Named populations, each a complete astrogwb.populations.PopulationMetadata: a
# registered model and its construction kwargs. A seed is not part of a
# population: it picks one realization of the density, so a run states the seed
# of each catalog role in [analysis.seeds].
# A catalog or an analysis target picks one by reference --
# population = "${populations.guard}".
#
# The redshift window is stated once, in [populations.cosmological], and every
# other population's model_kwargs `extends` its model_kwargs, so narrowing it
# narrows them all. A reference merges as the table it names, so one role can
# change a single field -- a size -- and keep the rest. To change a population
# for every role that names it in one run -- a mixing fraction --
# override it here, at its source, in that run's layer.

# Every population is the one registered model "bns_coba"; the variants are its
# construction kwargs (mass_model, uniform_mixing_fraction, time_delay, ...), and
# the contracts each one carries are documented on
# astrogwb.populations.bns_coba.bns_coba_population_fn.

# The population every catalog is drawn from unless its role names another.
# Isotropic inclination is always sampled.
[populations.cosmological]
model_name = "bns_coba"
model_kwargs = { mass_model = "uniform", minimum_redshift = 0.35, maximum_redshift = 20.0, n_grid = 4096 }

# The guarded proposal: the cosmological population mixed with a uniform
# component, so no region the target reaches has vanishing proposal density.
# Its merger rate does not normalize its density, so it is only ever a proposal.
[populations.guard]
model_name = "bns_coba"

[populations.guard.model_kwargs]
extends = "${populations.cosmological.model_kwargs}"
uniform_mixing_fraction = 0.1

# Mergers delayed from star formation, drawn for the time-delay injection.
[populations.time_delayed]
model_name = "bns_coba"

[populations.time_delayed.model_kwargs]
extends = "${populations.cosmological.model_kwargs}"
time_delay = true
minimum_delay = 0.02
maximum_formation_redshift = 20.0
n_delay_nodes = 48

# The analysis target every run's weights are evaluated at. Modified
# propagation reduces exactly to the standard law at xi_0 = 1, which is how a
# run that does not sample the propagation parameters gets the standard law. The grid is coarser
# than a draw's: it is the grid the spectral integral runs on. A target is
# evaluated, not drawn from.
[populations.target]
model_name = "bns_coba"

[populations.target.model_kwargs]
extends = "${populations.cosmological.model_kwargs}"
n_grid = 256

# The time-delayed population as an analysis target, on the target's grid.
[populations.time_delayed_target]
model_name = "bns_coba"

[populations.time_delayed_target.model_kwargs]
extends = "${populations.time_delayed.model_kwargs}"
n_grid = "${populations.target.model_kwargs.n_grid}"
