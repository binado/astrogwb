# Named populations, each a complete astrogwb.populations.PopulationMetadata: a
# registered model and its construction kwargs. A catalog picks one by
# reference -- population = "${populations.cosmological}".
#
# The redshift window is stated once, in [populations.cosmological]; any other
# population's model_kwargs should `extends` its model_kwargs, so narrowing it
# narrows them all.

# Every population is the registered model "bns_coba"; the variants are its
# construction kwargs, documented on
# astrogwb.populations.bns_coba.bns_coba_population_fn.

# The population every catalog is drawn from.
# Isotropic inclination is always sampled.
[populations.cosmological]
model_name = "bns_coba"
model_kwargs = { mass_model = "uniform", minimum_redshift = 0.35, maximum_redshift = 20.0, n_grid = 4096 }
