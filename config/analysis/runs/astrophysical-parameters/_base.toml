# The Madau-Dickinson rate shape with H0 amplitude-marginalized out.
#
# Both runs need the guarded (eps = 0.1) proposal: sampling the rate
# shape moves the posterior away from the proposal, and the uniform
# component keeps the importance weights from degenerating.

[analysis]
network = "ET-2L-aligned-CE-Hanford"
likelihood = "amplitude_marginalized"
amplitude_parameter = "H0"
amplitude_num_nodes = 1024

[catalog]
proposal = "md-uniform-imrphenom-s61-n16384-eps1e-1"
