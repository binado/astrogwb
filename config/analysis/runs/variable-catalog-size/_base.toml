# How the H0 posterior tightens with proposal catalog size.
#
# The runs differ only in which proposal catalog they name; every other
# setting is pinned here so the comparison is clean. The three catalogs are
# nested prefixes of one seed-42 stream, so the sizes are a clean series.

sampled_params = ["H0"]

[analysis]
detectors = ["S1", "R1", "C1"]

[sampler]
num_warmup = 500
dense_mass = false
