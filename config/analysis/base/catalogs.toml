# The two catalogs every run uses, by name.
#
# Each name resolves to config/catalogs/defs/<name>.toml and to the
# outputs/catalogs/<name>.h5 it produces. How a catalog was drawn -- its
# components, seeds and mixing fractions -- lives in those files, not here,
# and the redshift density that follows from them is read back off the
# generated file at run time.
#
# The injection is the same for all 26 runs: it is the "observed" data, so no
# run overrides it. Only variable-catalog-size, variable-proposal-guard,
# astrophysical-parameters, and waveform-approximant override the proposal.

[catalog]
injection = "md-imrphenom-s41-n32768"
proposal = "md-imrphenom-s41-n32768"
