# The two catalogs every run composes in memory from persisted banks.
#
# The injection catalog is the same for all 26 runs -- it is the
# "observed" data -- so no run overrides it. The proposal catalog is the
# importance-sampling draw; only variable-catalog-size,
# variable-proposal-guard, astrophysical-parameters, and
# waveform-approximant override it.
#
# The proposal *density* is not configured here: it is read back from the
# md_bank's own provenance attributes at run time.

# The fixed fiducial injection, drawn at seed 41.
[catalog.injection]
md_bank = "md-imrphenom-s41"
num_samples = 32768

# Independent draws at seed 42; eps = 0 by default.
[catalog.proposal]
md_bank = "md-imrphenom-s42"
num_samples = 16384
