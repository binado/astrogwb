# NUTS defaults and the sampling RNG seed. Experiments that sample a
# single scalar override [sampler] with a diagonal mass matrix and a
# shorter warmup.

[sampler]
seed = 42
num_warmup = 1000
num_samples = 2000
num_chains = 4
target_accept = 0.9
dense_mass = true
max_tree_depth = 10
forward_mode_differentiation = false
progress_bar = true
jit_model_args = true
