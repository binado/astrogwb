# The frequency band and redshift grid every run's inputs are built on.
# [analysis.detectors] is deliberately absent: a run without a detector
# list must fail, never silently inherit someone else's network.

observation_time = 1.0

[analysis]
f_min = 2.0
f_max = 2048.0

[cosmology]
minimum_redshift = 0.3
maximum_redshift = 20.0
n_grid = 256
