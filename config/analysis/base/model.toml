# The frequency band, and the population every run's hyperparameters
# describe.
#
# [analysis.network] is deliberately absent: a run without a network name
# must fail, never silently inherit someone else's. The names it may take are
# declared in config/networks.json, which resolves each one to its detectors.
#
# The redshift window and grid live in [analysis.population.model_kwargs]
# because that is what they are: the construction settings the target
# population is built with. The same three numbers define the grid the
# spectral integral runs on, so they are stated once and read back through
# `AnalysisConfig.grid`.

[analysis]
observation_time = 1.0
minimum_frequency = 2.0
maximum_frequency = 2048.0

[analysis.population]
model_name = "bns_md_modified_propagation"

[analysis.population.model_kwargs]
minimum_redshift = 0.3
maximum_redshift = 20.0
n_grid = 256
