# variable-proposal-guard (3 runs): how the uniform-mixing guard fraction eps
# affects the same H0-MD problem as astrophysical-parameters/madau-dickinson --
# H0 is the marginalized amplitude and NUTS samples the redshift-rate shape.
# The runs differ only in their proposal's guard fraction, and each eps is
# drawn at its own mixture seed, so the three draws are independent. See
# astrophysical-parameters/_base.toml for what the guard mixture is.
[analysis]
sampled_params = ["gamma", "kappa", "z_peak"]
network = "ET-2L-aligned-CE-Hanford"
likelihood = "amplitude_marginalized"
amplitude_parameter = "H0"
amplitude_num_nodes = 1024

# Every run's proposal is a 16384-source guard draw; each run sets its own
# eps and mixture seed on [populations.guard].
[analysis.proposal]
population = "${populations.guard}"
num_samples = 16384
