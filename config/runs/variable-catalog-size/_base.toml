# variable-catalog-size (3 runs): how the H0 posterior tightens with proposal
# catalog size. The runs differ only in their proposal's num_samples; every
# other setting is pinned here so the comparison is clean.
#
# The three proposals are seed-42 draws, and they are exact prefixes of one
# another: Predictive allocates per-draw keys with jax.random.split, which is
# prefix-stable, so the sizes are nested draws rather than unrelated ones.
# test_a_smaller_catalog_is_a_prefix_of_a_larger_one in
# tests/core/test_populations.py checks it rather than assuming it.
[analysis]
sampled_params = ["H0"]
network = "ET-2L-aligned-CE-Hanford"

[sampler]
num_warmup = 500
dense_mass = false
