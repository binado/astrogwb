# Shared detector networks and optional detector overrides. Later layers
# can override membership, PSD references, labels, or geometry.
# Geometry fields use gwmock radians (azimuths clockwise from North) and metres, as in the packaged geometry.toml.

# Each detector network, by name. The figures' legend order is astrogwb.paper.plotting.DETECTOR_NETWORKS.
[networks]
ET-triangular = ["E1", "E2", "E3"]
ET-triangular-CE-Hanford = ["E1", "E2", "E3", "C1"]
ET-2L-aligned = ["S1", "R1"]
ET-2L-aligned-CE-Hanford = ["S1", "R1", "C1"]
ET-2L-misaligned = ["S2", "R2"]
ET-2L-misaligned-CE-Hanford = ["S2", "R2", "C1"]

# Packaged geometry and sensitivity tables supply the default definitions.
[detectors]
