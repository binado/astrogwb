# The BNS population every catalog is drawn from, and drawn at.
#
# `source_model` / `rate_model` are keys in the astrogwb.populations source
# and merger-rate registries, not import paths: registry keys change only on
# purpose, while module paths move as collateral. The guarded-proposal
# catalogs override `source_model` with the uniform-mixture variant and add
# `uniform_mixing_fraction` to [population.source_kwargs]; `rate_model` stays
# the Madau-Dickinson rate every catalog pairs with.
#
# Everything here is copied verbatim into the generated .h5 file, which is what
# makes the catalog self-describing. Nothing re-reads this layer at analysis
# time, and no run config restates any of it, so there is nothing for the two
# to disagree about. This layer is declared as a Snakemake input of every
# catalog, so editing it correctly invalidates all of them.

[population]
source_model = "bns_md_cosmological"
rate_model = "madau_dickinson"
# Density factors and source outputs are declared by the source model class.

# Construction settings routed to *both* models: the redshift window and the
# grid the cosmology integrals and the density normalization run on.
# Narrowing the window to an analysis band is a Catalog operation, not an
# edit here.
[population.kwargs]
z_min = 0.0
z_max = 20.0
n_grid = 4096

# The hyperparameters the draw is made at. `local_merger_rate` (Gpc^-3 yr^-1)
# does not affect the normalized source draws, but the injection's observed
# spectrum is reconstructed from it, so it is recorded rather than restated in
# the run config.
[population.params]
H0 = 67.66
Omega_m = 0.3096
gamma = 1.42
kappa = 4.62
z_peak = 1.84
local_merger_rate = 770.0
minimum_mass = 1.0
mass_width = 1.5
