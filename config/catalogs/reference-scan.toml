# Explicit reference-catalog snapshot; regenerate the output after edits.
num_samples = 16384
sampling = "sobol"
reference_redshift = 0.00022565039557

[waveform]
approximant = "IMRPhenomXAS_NRTidalv3"
minimum_frequency = 2.0
maximum_frequency = 4000.0
reference_frequency = 20.0
sampling_frequency = 8192.0
frequency_spacing = "log"
frequency_resolution = 0.02
use_taper_in_tidal_corrections = true

[population]
model_name = "bns_coba"

[population.model_kwargs]
mass_model = "uniform"
minimum_redshift = 0.35
maximum_redshift = 20.0
n_grid = 4096

[fiducials]
H0 = 67.66
Omega_m = 0.3096
xi_0 = 1.0
xi_n = 1.91
gamma = 1.42
kappa = 4.62
z_peak = 1.84
local_merger_rate = 770.0
minimum_mass = 1.0
mass_width = 1.5
