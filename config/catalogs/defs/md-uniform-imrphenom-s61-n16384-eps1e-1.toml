# Guarded proposal at eps = 1e-1: the Madau-Dickinson redshift law with a
# uniform-in-redshift component mixed in, so the importance weights do not
# degenerate when NUTS moves the posterior away from the proposal.
#
# The mixture is one density, not two draws blended after the fact: the same
# `MixtureGeneral` that draws the redshifts evaluates their log density, so the
# recorded guard fraction can never be something other than what was drawn.
# That replaced a pair of gwmock graphs whose only difference was the redshift
# block, plus a hand-written mixture log-density in the analysis layer.
#
# [population.params] is inherited whole from the base layer, `local_merger_rate`
# included, even though this population declares no merger rate: a guard
# mixture is a sampling density, not a physical population, and the
# Madau-Dickinson total rate normalizes the Madau-Dickinson redshift density,
# not a mixture of it with a uniform component. Nothing reads a rate off a
# proposal -- importance weighting takes the target's -- and a catalog drawn
# from this population now fails by name if used as an injection.
num_samples = 16384
seed = 61

[population]
model = "bns_md_uniform_mixture"

[population.kwargs]
uniform_mixing_fraction = 1e-1
