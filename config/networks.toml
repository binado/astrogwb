# Every network a simulated background records: `astrogwb simulate
# --background-metadata`. Detectors are packaged site codes. The ET-D networks
# are the ET triangle's detectors with the ET-D noise curve; the paper registry
# (config/detectors.toml) names those detectors E1D-E3D. Keep both in step, and
# regenerate the ensembles after an edit.
[networks.ET-triangular]
detectors = [
    "E1",
    "E2",
    "E3",
]

[networks.ET-triangular.psd_references]
E1 = "ET_COBA_10km_psd.txt"
E2 = "ET_COBA_10km_psd.txt"
E3 = "ET_COBA_10km_psd.txt"

[networks.ET-triangular-CE-Hanford]
detectors = [
    "C1",
    "E1",
    "E2",
    "E3",
]

[networks.ET-triangular-CE-Hanford.psd_references]
C1 = "cosmic_explorer_strain_psd.txt"
E1 = "ET_COBA_10km_psd.txt"
E2 = "ET_COBA_10km_psd.txt"
E3 = "ET_COBA_10km_psd.txt"

[networks.ET-2L-aligned]
detectors = [
    "R1",
    "S1",
]

[networks.ET-2L-aligned.psd_references]
R1 = "ET_COBA_15km_psd.txt"
S1 = "ET_COBA_15km_psd.txt"

[networks.ET-2L-aligned-CE-Hanford]
