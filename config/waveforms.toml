# Named waveform settings, each a complete astrogwb.metadata.WaveformMetadata.
# A catalog picks one by reference -- waveform = "${waveforms.default}" -- so a
# run that draws with another approximant names a variant here rather than
# patching the default.
#
# The frequency grid is frequency_spacing over [minimum_frequency,
# maximum_frequency]. "loglinear" is linear at frequency_resolution up to
# turnover_frequency and geometric above it, with the bin width continuous at
# the turn; "linear" is uniform at frequency_resolution and takes no
# turnover_frequency. Most of the signal sits at low frequency, so the loglinear
# grid spends its bins there.

# The waveform every catalog draws with unless its role names another.
[waveforms.default]
approximant = "IMRPhenomXAS_NRTidalv3"
sampling_frequency = 8192.0
minimum_frequency = 2.0
maximum_frequency = 2048.0
reference_frequency = 20.0
frequency_spacing = "loglinear"
frequency_resolution = 1.0
turnover_frequency = 100.0

# The default waveform on a uniform grid at the default resolution: the grid
# every catalog used before the loglinear grid, for checking one against the
# other.
[waveforms.linear]
approximant = "${waveforms.default.approximant}"
sampling_frequency = "${waveforms.default.sampling_frequency}"
minimum_frequency = "${waveforms.default.minimum_frequency}"
maximum_frequency = "${waveforms.default.maximum_frequency}"
reference_frequency = "${waveforms.default.reference_frequency}"
frequency_spacing = "linear"
frequency_resolution = "${waveforms.default.frequency_resolution}"

# The default band and grid with the TaylorF2 approximant, for the
# waveform-systematics proposal.
[waveforms.TaylorF2]
extends = "${waveforms.default}"
approximant = "TaylorF2"
