# Named waveform settings, each a complete astrogwb.waveform.WaveformMetadata.
# A catalog picks one by reference -- waveform = "${waveforms.default}".
#
# The frequency grid is frequency_spacing over [minimum_frequency,
# maximum_frequency]; see WaveformMetadata for the spacings.

# The waveform every ensemble draws with unless its role names another: a 1 Hz
# Fourier grid, a whole number of modes of any power-of-two noise segment, to
# 200 Hz, where the SNR has long saturated (cutting at 200 rather than 2048 Hz
# moved no H0, Xi0-n or Madau-Dickinson posterior). sampling_frequency only
# sets Ripple's FFT grid, of which the band is a slice: 512 Hz keeps it to the
# 256 bins below Nyquist.
[waveforms.default]
approximant = "IMRPhenomXAS_NRTidalv3"
sampling_frequency = 512.0
minimum_frequency = 2.0
maximum_frequency = 200.0
reference_frequency = 20.0
frequency_spacing = "linear"
frequency_resolution = 1.0

# The default band and grid with the TaylorF2 approximant, for the
# waveform-systematics proposal.
[waveforms.TaylorF2]
extends = "${waveforms.default}"
approximant = "TaylorF2"
