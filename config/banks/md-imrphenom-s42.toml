# Proposal bank: the same graph as md-imrphenom-s41 at a different seed, so the
# importance draws are independent of the injection draws.
population = "madau-dickinson"
seed = 42
num_samples = 32768

[waveform]
approximant = "IMRPhenomXAS_NRTidalv3"
