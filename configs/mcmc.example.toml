# Example config for scripts/run_mcmc.py -- the headless NumPyro MCMC runner.
# Mirrors the Configuration cell of notebooks/mcmc.py. Copy this per array task
# (configs/task_0.toml, ...) and edit the parts that differ between tasks.

seed = 42
observation_time = 1.0       # [yr]; cancels in S_h, kept for the likelihood scale

# Parameters to infer. Each must have a [priors.<name>] table and a [fiducials]
# entry. Everything else in [fiducials] is held fixed as a constant.
# (Optional: omit this key to default to every parameter present in [priors].)
sampled_params = ["H0"]

[runtime]
platform = "auto"            # auto | cpu | gpu  (auto lets JAX pick GPU if present)
# Omit host_device_count to create one CPU device per configured chain automatically.
cpu_threads = 0              # 0 = leave JAX/XLA default; else OMP/XLA intra-op threads
chain_method = "auto"        # auto | parallel | sequential | vectorized
                             # auto -> vectorized on a single GPU, else parallel

[catalog]
path = "out/bns_waveform_catalog.h5"
# sha256 = "<hex digest>"     # optional content pin; run_mcmc.py verifies it before loading
detectors = ["S1", "R1", "C1"]   # resolved via bundled geometry.toml / sensitivity.toml
f_min = 2.0                 # analysis band low edge [Hz]
f_max = 4096.0                # analysis band high edge [Hz]

[cosmology]
z_min = 0.0
z_max = 20.0                 # must bracket all catalog redshifts (importance-weight requirement)
n_grid = 256                # grid points for cosmology integrals / MD normalization

[sampler]
num_warmup = 2000
num_samples = 2000
num_chains = 4
target_accept = 0.9
dense_mass = true
max_tree_depth = 10
forward_mode_differentiation = true   # Julia used ForwardDiff; grid integrals are fwd-friendly
progress_bar = true
jit_model_args = true

[fiducials]
# The proposal catalog's parameter point. Julia Xi_0 -> xi_0, Xi_n -> xi_n
# (GR is xi_0=1, xi_n=0). Madau–Dickinson shape: gamma, kappa, z_peak.
H0 = 67.66
Omega_m = 0.3096
xi_0 = 1.0
xi_n = 1.91
gamma = 1.42
kappa = 4.62
z_peak = 1.84
local_merger_rate = 161.0    # [Gpc^-3 yr^-1], matches COBA simulations

# Priors: one [priors.<param>] table per sampled parameter.
# Supported types: uniform (low/high), normal (loc/scale).
[priors.H0]
type = "uniform"
low = 20.0
high = 140.0

# Add more to sample further parameters, e.g.:
# [priors.Omega_m]
# type = "uniform"
# low = 0.05
# high = 0.95

[output]
outdir = "chains"
label = ""                   # blank -> auto name: mcmc-<params>-det=<dets>-seed<seed>-<timestamp>
