# Invariant template for configs/mcmc.sweeps.toml. The sweep compiler supplies
# observation_time, [analysis], sampled_params, and [priors] for every run.

seed = 42

[cosmology]
z_min = 0.0
z_max = 20.0
n_grid = 256

[sampler]
num_warmup = 2000
num_samples = 2000
num_chains = 4
target_accept = 0.9
dense_mass = true
max_tree_depth = 10
forward_mode_differentiation = true
progress_bar = true
jit_model_args = true

[fiducials]
H0 = 67.66
Omega_m = 0.3096
xi_0 = 1.0
xi_n = 1.91
gamma = 1.42
kappa = 4.62
z_peak = 1.84
local_merger_rate = 161.0

[output]
outdir = "chains"
label = ""
