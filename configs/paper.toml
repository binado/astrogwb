[paths]
catalog = "out/bns_waveform_catalog_n=16384_df=1Hz.h5"
figures_dir = "figures"
chains_dir = "chains"

[analysis]
observation_time = 1.0
f_min = 2.0
f_max = 4096.0

[analysis.cosmology]
z_min = 0.0
z_max = 20.0
n_grid = 256

[analysis.fiducials]
H0 = 67.66
Omega_m = 0.3096
xi_0 = 1.0
xi_n = 1.91
gamma = 1.42
kappa = 4.62
z_peak = 1.84
local_merger_rate = 161.0

[detector_networks]
"ET-triangular" = ["E1", "E2", "E3"]
"ET-triangular-CE-Hanford" = ["E1", "E2", "E3", "C1"]
"ET-2L-aligned" = ["S1", "R1"]
"ET-2L-aligned-CE-Hanford" = ["S1", "R1", "C1"]
"ET-2L-misaligned" = ["S2", "R2"]
"ET-2L-misaligned-CE-Hanford" = ["S2", "R2", "C1"]

[figures.mcmc_compare_posteriors]
# Posterior styling lives below; each entry's chain resolves to
# <paths.chains_dir>/<campaign>/<run>.nc, produced by the Snakemake run_mcmc rule.
campaign = "paper-h0"

[figures.mcmc_compare_posteriors.ax_kwargs]
xlabel = '$H_0 \ [\mathrm{km \ s^{-1} \ Mpc^{-1}}]$'
ylabel = "Posterior density"

[figures.mcmc_compare_posteriors.legend_kwargs]
ncol = 3
loc = "lower center"
bbox_to_anchor = [0.5, 1.02]
frameon = false
borderaxespad = 0

[[figures.mcmc_compare_posteriors.posteriors]]
network = "ET-triangular"
label = 'ET-$\Delta$'
run = "et-triangular"
color = "tab:blue"
linestyle = "-"

[[figures.mcmc_compare_posteriors.posteriors]]
network = "ET-triangular-CE-Hanford"
label = 'ET-$\Delta +$ CE'
run = "et-triangular-ce-hanford"
color = "tab:blue"
linestyle = "--"

[[figures.mcmc_compare_posteriors.posteriors]]
network = "ET-2L-aligned"
label = "ET-2L"
run = "et-2l-aligned"
color = "tab:orange"
linestyle = "-"

[[figures.mcmc_compare_posteriors.posteriors]]
network = "ET-2L-aligned-CE-Hanford"
label = 'ET-2L $+$ CE'
run = "et-2l-aligned-ce-hanford"
color = "tab:orange"
linestyle = "--"

[[figures.mcmc_compare_posteriors.posteriors]]
network = "ET-2L-misaligned"
label = 'ET-2L-$\alpha$'
run = "et-2l-misaligned"
color = "tab:green"
linestyle = "-"

[[figures.mcmc_compare_posteriors.posteriors]]
network = "ET-2L-misaligned-CE-Hanford"
label = 'ET-2L-$\alpha +$ CE'
run = "et-2l-misaligned-ce-hanford"
color = "tab:green"
linestyle = "--"
