# Coverage draws on SLURM, CPU only:
#   uv run --no-sync snakemake \
#       --profile workflow/profiles/slurm --dry-run
# Needs the project venv synced with the `cluster` group; see
# docs/coverage-draws-on-slurm.md.
# Job logs land under .snakemake/slurm_logs/, each command's own under logs/.
executor: slurm
# One draw per array task, with at most 1000 tasks in flight.
jobs: 1000
slurm-array-jobs: simulate,simulate_slurm_test
slurm-array-limit: 1000
keep-going: true
rerun-incomplete: true
# Re-run a draw only when its file is missing or a config it reads is newer.
# A changed config then fails on the realization's recorded settings rather
# than silently redrawing: delete the ensemble to regenerate it.
rerun-triggers: mtime
# Outputs land on a shared filesystem the controller polls.
latency-wait: 120
retries: 1
default-resources:
  slurm_partition: short
  # Uncomment for clusters that require it:
  # slurm_account: <account>
  # Two draws peaked at 2.1 GB RSS on an M4 (/usr/bin/time -l); XLA's
  # per-thread buffers grow with `threads`. With one draw a job, an
  # out-of-memory kill loses a single ~80 s draw, redrawn by retries=1,
  # so ~2x headroom is enough.
  mem_mb: 4000
  # One ~80 s draw plus interpreter start and job-nanny's node-local staging
  # fit well under 10 min; 20 min leaves headroom for a busier node. Backfill
  # places jobs against their time limit, so the shorter the better, and a
  # job killed at its limit loses a single draw, redrawn by retries=1.
  runtime: 20
