# Coverage draws on SLURM, CPU only:
#   uv run --no-sync snakemake \
#       --profile workflow/profiles/slurm --dry-run
# Needs the project venv synced with the `cluster` group; see
# docs/coverage-draws-on-slurm.md.
# Job logs land under .snakemake/slurm_logs/, each command's own under logs/.
executor: slurm
# One draw per job, with at most 1000 jobs in flight. Array jobs are not used:
# job-nanny keys its staging directory on $SLURM_JOBID, which every task of an
# array shares, so concurrent tasks would clobber each other's staging.
jobs: 1000
keep-going: true
rerun-incomplete: true
# Re-run a draw only when its file is missing or a config it reads is newer.
# A changed config then fails on the realization's recorded settings rather
# than silently redrawing: delete the ensemble to regenerate it.
rerun-triggers: mtime
# Outputs land on a shared filesystem the controller polls.
latency-wait: 120
retries: 1
default-resources:
  slurm_partition: short
  # Uncomment for clusters that require it:
  # slurm_account: <account>
  # Two draws peaked at 2.1 GB RSS on an M4 (/usr/bin/time -l); XLA's
  # per-thread buffers grow with `threads`. With one draw a job, an
  # out-of-memory kill loses a single draw, redrawn by retries=1, so ~2x
  # headroom is enough (one draw peaked at 2.26 GB on an M-series Mac, 8 threads).
  mem_mb: 4000
  # One draw took 8 min 10 s wall on 8 threads of an M-series Mac but 26-27 min
  # on the cluster (sacct, slurm-test: two draws, TotalCPU/(Elapsed x CPUs)
  # about 0.93); 20 min timed out. 60 is about twice the cluster time, for
  # node-to-node variance. Backfill places jobs against their time limit, so
  # the shorter the better, and a job killed at its limit loses a single draw,
  # redrawn by retries=1, which would hit the same limit.
  runtime: 60
