[project]
name = "astrogwb-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["astrogwb-paper"]

[tool.uv]
package = false

[tool.uv.sources]
astrogwb = { workspace = true }
astrogwb-paper = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
# Converts and executes the root notebooks. These depend on core alone --
# simulation to draw a population, io to round-trip it through HDF5 -- so
# matplotlib is listed directly rather than arriving via astrogwb-paper.
notebook = [
    "astrogwb[simulation,io]",
    "ipykernel>=7.3.0",
    "jupytext>=1.19",
    "matplotlib>=3.10.0",
    # jupytext --execute drives the kernel through nbconvert. It used to arrive
    # transitively via astrogwb-paper's jupyter dependency; declare it here so
    # the notebook environment does not depend on the paper package at all.
    "nbconvert>=7.16",
]
dev = [
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]

[tool.ruff]
extend-exclude = [".antigravitycli", ".cache", ".claude", ".cursor"]
include = [
    "packages/*/src/**/*.py",
    "packages/*/tests/**/*.py",
    "packages/astrogwb/examples/**/*.py",
    "packages/astrogwb-paper/scripts/**/*.py",
    "packages/astrogwb-paper/notebooks/**/*.py",
    "notebooks/**/*.py",
]

[tool.ruff.lint.per-file-ignores]
# Colab bootstrap + configure_runtime must run before JAX-touching imports.
"packages/astrogwb-paper/notebooks/mcmc.py" = ["E402"]
# B018: a bare name on a cell's last line is how a notebook renders a value,
# not a useless expression. DTZ005: run-artifact filenames are stamped with
# local wall-clock time on purpose, so the author recognizes their own runs.
"notebooks/**/*.py" = ["B018", "DTZ005"]
"packages/astrogwb-paper/notebooks/**/*.py" = ["B018", "DTZ005"]

[tool.ty.src]
include = [
    "packages/astrogwb/src",
    "packages/astrogwb/tests",
    "packages/astrogwb/examples",
    "packages/astrogwb-paper/src",
    "packages/astrogwb-paper/tests",
]

[tool.pytest.ini_options]
addopts = "-n auto --dist loadscope"
testpaths = ["packages/astrogwb/tests", "packages/astrogwb-paper/tests"]
markers = [
    "integration: tests that call external libraries or services (deselect with -m 'not integration')",
]
