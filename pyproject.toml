[project]
name = "astrogwb"
version = "0.9.0"
description = "Bayesian inference for compact-binary stochastic gravitational-wave backgrounds"
readme = "README.md"
authors = [
    { name = "Bernardo Veronese", email = "bernardopveronese@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "gwmock-noise>=0.10.1",
    "gwmock-signal[jax]>=0.15.0",
    # Direct, not transitive through gwmock-signal[jax]: the Ripple adapter in
    # astrogwb.waveform.generator imports ripplegw itself.
    "ripplegw>=0.3.1",
    "jax>=0.10.2; sys_platform == 'linux'",
    "jax[cpu]>=0.11.0; sys_platform != 'linux'",
    "numpy>=2.1",
    "numpyro>=0.21.0",
    # Direct, though gwmock-noise already installs it and imports it at module
    # scope: core owns the metadata models every persisted artifact carries, so
    # the dependency is declared rather than borrowed from a transitive edge
    # that gwmock-noise is free to drop.
    "pydantic>=2.14",
    "pyknf>=0.6,<0.8",
]

[project.scripts]
astrogwb = "astrogwb.cli:app"

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.11.0"]
# HDF5 catalog serialization is opt-in and the published wheel stays lean.
io = ["h5py>=3.15"]
# The `astrogwb` command line: simulator stages written to disk.
cli = ["astrogwb[io]", "gwmock-pop>=0.11.4", "typer>=0.16"]
# Only the integration cosmology cross-check needs it now: populations are
# declared as NumPyro models here, so nothing in the library draws through a
# gwmock graph any more.
simulation = ["gwmock-pop>=0.11.4"]
tpu = ["jax[tpu]>=0.11.0"]

[project.urls]
Homepage = "https://github.com/binado/astrogwb"
Repository = "https://github.com/binado/astrogwb"
Issues = "https://github.com/binado/astrogwb/issues"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

# Groups are tooling: never imported by shipped code, never part of a wheel.
[dependency-groups]
# tomli-w writes the TOML inputs of the CLI tests.
test = ["pytest>=9.0.2", "pytest-xdist>=3.8.0", "tomli-w>=1.2"]
# Reference packages the parity suite (tests/parity) calls directly. pygwb is
# not among them: it pins scipy<1.14, so its references are frozen arrays
# written by tests/parity/references/generate_pygwb.py in its own environment.
parity = [
    { include-group = "test" },
    "bilby>=2.8.2",
]
dev = [
    { include-group = "parity" },
    "ruff>=0.16.1",
    "ty>=0.0.69",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"astrogwb_experiment".msg = "The library must not depend on the experiment application."

[tool.ty.src]
include = ["src", "tests"]
# Runs in its own environment (inline script metadata), not this one.
exclude = ["tests/parity/references/generate_pygwb.py"]

[tool.pytest.ini_options]
addopts = "-n auto --dist loadscope"
# Parity needs its own environment (bilby), so it is run by `just test-parity`.
testpaths = ["tests/test_*.py"]
markers = [
    "integration: tests that call external libraries or services (deselect with -m 'not integration')",
]
