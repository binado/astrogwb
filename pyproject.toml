[project]
name = "astrogwb"
version = "0.1.0"
description = "Constraining cosmology with the SGWB from compact binary coalescences"
readme = "README.md"
authors = [
    { name = "Bernardo Veronese", email = "bernardopveronese@gmail.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "gwmock-noise>=0.7.1",
    "gwmock-pop>=0.11.1",
    "gwmock-signal[jax]>=0.10.0",
    "jax[cuda12]>=0.10.2; sys_platform == 'linux'",
    "jax[cpu]>=0.10.2; sys_platform != 'linux'",
    "numpy>=2.5.1",
    "numpyro>=0.21.0",
    "pluscross>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
mcmc = [
    "arviz[h5netcdf]>=1.2.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
plotting = [
    "arviz>=1.2.0",
    "corner @ git+https://github.com/dfm/corner.py@d9c1219dfbe6cfe02b3bfd8768428e5e7c88b3f4",
    "h5netcdf>=1.8.1",
    # pandas' DataFrame.style (used in the paper-table notebooks) requires jinja2.
    "jinja2>=3.1",
]
dev = [
    { include-group = "plotting" },
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "pytest>=9.0.2",
    "ruff>=0.15.21",
    "snakemake>=9.13.4",
    "ty>=0.0.59",
]
slurm = [
    { include-group = "dev" },
    "snakemake-executor-plugin-slurm>=1.5",
]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external libraries or services (deselect with -m 'not integration')",
]
