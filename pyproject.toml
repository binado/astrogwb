[project]
name = "astrogwb"
version = "0.1.0"
description = "Constraining cosmology with the SGWB from compact binary coalescences"
readme = "README.md"
authors = [
    { name = "Bernardo Veronese", email = "bernardopveronese@gmail.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "gwmock-noise>=0.6.1",
    "gwmock-pop>=0.10.3",
    "gwmock-signal[jax]>=0.9.2",
    "jax[cuda12]>=0.10.2; sys_platform == 'linux'",
    "jax[cpu]>=0.10.2; sys_platform != 'linux'",
    "numpy>=2.5.1",
    "numpyro>=0.21.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
plotting = [
    "arviz>=1.2.0",
    "corner @ git+https://github.com/dfm/corner.py@d9c1219dfbe6cfe02b3bfd8768428e5e7c88b3f4",
    "h5netcdf>=1.8.1",
]
dev = [
    { include-group = "plotting" },
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "pytest>=9.0.2",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external libraries or services (deselect with -m 'not integration')",
]
