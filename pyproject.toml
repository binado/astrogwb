[project]
name = "astrogwb-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["astrogwb-paper"]

[tool.uv]
package = false

[tool.uv.sources]
astrogwb = { workspace = true }
astrogwb-paper = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]

[tool.ruff]
extend-exclude = [".antigravitycli", ".cache", ".claude", ".cursor"]
include = [
    "packages/*/src/**/*.py",
    "packages/*/tests/**/*.py",
    "packages/astrogwb-paper/scripts/**/*.py",
]

# Colab bootstrap + configure_runtime must run before JAX-touching imports.
[tool.ruff.lint.per-file-ignores]
"packages/astrogwb-paper/notebooks/mcmc.py" = ["E402"]

[tool.ty.src]
include = [
    "packages/astrogwb/src",
    "packages/astrogwb/tests",
    "packages/astrogwb-paper/src",
    "packages/astrogwb-paper/tests",
]

[tool.pytest.ini_options]
testpaths = ["packages/astrogwb/tests", "packages/astrogwb-paper/tests"]
markers = [
    "integration: tests that call external libraries or services (deselect with -m 'not integration')",
]
