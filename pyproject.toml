[project]
name = "astrogwb"
version = "0.1.0"
description = "Constraining cosmology with the SGWB from astrophysical sources"
readme = "README.md"
authors = [
    { name = "binado", email = "bernardopveronese@gmail.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "gwmock-noise>=0.5.3",
    "gwmock-pop>=0.10.1",
    "gwmock-signal[jax]>=0.9.2",
    "jax>=0.10.2",
    "numpy>=2.4.2",
    "numpyro>=0.21.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "arviz>=1.2.0",
    "corner>=2.2.3",
    "h5netcdf>=1.8.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "ty>=0.0.18",
]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external libraries or services (deselect with -m 'not integration')",
]
