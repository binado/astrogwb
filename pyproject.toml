[project]
name = "astrogwb"
version = "0.6.0"
description = "Bayesian inference for compact-binary stochastic gravitational-wave backgrounds"
readme = "README.md"
authors = [
    { name = "Bernardo Veronese", email = "bernardopveronese@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
# The publishable core. The application's own stack -- arviz, xarray, pyyaml --
# is an extra, so `pip install astrogwb` stays lean.
dependencies = [
    "gwmock-noise>=0.10.1",
    "gwmock-signal[jax]>=0.15.0",
    # Direct, not transitive through gwmock-signal[jax]: the Ripple adapter in
    # astrogwb.waveform.generator imports ripplegw itself.
    "ripplegw>=0.3.1",
    "jax>=0.10.2; sys_platform == 'linux'",
    "jax[cpu]>=0.11.0; sys_platform != 'linux'",
    "numpy>=2.5.1",
    "numpyro>=0.21.0",
    # Direct, though gwmock-noise already installs it and imports it at module
    # scope: core owns the metadata models every persisted artifact carries, so
    # the dependency is declared rather than borrowed from a transitive edge
    # that gwmock-noise is free to drop.
    "pydantic>=2.11",
    # Writes the TOML manifests of the simulator stages (astrogwb.simulators).
    "tomli-w>=1.2",
]

[project.scripts]
astrogwb = "astrogwb.cli:app"

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.11.0"]
# HDF5 catalog serialization is opt-in and the published wheel stays lean.
io = ["h5py>=3.15"]
# The `astrogwb` command line: simulator stages written to disk.
cli = ["astrogwb[io]", "typer>=0.16"]
# Only the integration cosmology cross-check needs it now: populations are
# declared as NumPyro models here, so nothing in the library draws through a
# gwmock graph any more.
simulation = ["gwmock-pop>=0.11.4"]
tpu = ["jax[tpu]>=0.11.0"]
# The reproducibility application library: astrogwb.paper. It is shipped in the
# wheel but unimportable without this extra, which is the one-way dependency
# made physical -- see the ruff TID251 ban below for the other half. Its
# checkout-only entry points live under scripts/ and are not installed.
paper = [
    "astrogwb[io,simulation]",
    "arviz[h5netcdf]>=1.2.0",
    # Merges the config layers (astrogwb.paper.config.runs).
    "pyknf>=0.6,<0.8",
    # User cache paths, including XDG overrides on macOS.
    "platformdirs>=4.11.12",
]
# The analysis stack the notebooks and figure scripts import.
notebook = [
    "astrogwb[paper]",
    "arviz-base>=1.2.0",
    "arviz-plots>=1.2.0",
    "arviz-stats[xarray]>=1.2.0",
    "corner @ git+https://github.com/dfm/corner.py@d9c1219dfbe6cfe02b3bfd8768428e5e7c88b3f4",
    "matplotlib>=3.11.1",
    "pandas[output-formatting]>=2.0",
    "scipy>=1.10",
]
blackjax = [
    "blackjax>=1.2",
]

[project.urls]
Homepage = "https://github.com/binado/astrogwb"
Repository = "https://github.com/binado/astrogwb"
Issues = "https://github.com/binado/astrogwb/issues"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

# Groups are tooling: never imported by shipped code, never part of a wheel.
[dependency-groups]
test = ["pytest>=9.0.2", "pytest-xdist>=3.8.0"]
# Notebook editor/runner (marimo). The `notebook` extra, by contrast, is the
# library stack notebooks import.
notebook = [
    "marimo>=0.25.1",
]
dev = [
    { include-group = "notebook" },
    { include-group = "test" },
    "ruff>=0.16.1",
    "ty>=0.0.69",
]
# Snakemake on SLURM, for workflow/coverage_draws.smk. It runs from the
# project venv, so its jobs see the same interpreter as the scripts they run.
cluster = [
    "snakemake>=9.24",
    "snakemake-executor-plugin-slurm>=1.5",
]

[tool.uv]
default-groups = ["dev"]
# No `default-extras`: ruff's bundled uv schema rejects the key and warns on
# every lint run. Commands that need the application say so -- `uv run --extra
# paper ...` -- and a checkout is set up once with
# `uv sync --extra notebook --group dev`.

[tool.marimo.formatting]
# Match ruff's default so marimo's saves do not reformat notebooks.
line_length = 88

[tool.ruff]
extend-exclude = [".antigravitycli", ".cache", ".claude", ".cursor"]
include = [
    "src/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
    "notebooks/**/*.py",
]

[tool.ruff.lint]
# ruff 0.16's default rule set is already broad (E/F/B/I/UP/S/SIM/TRY/PTH/...);
# `extend-select` adds to it rather than replacing it, which a bare `select`
# would do.
extend-select = ["TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The one-way dependency the two-package split used to enforce structurally.
# The `paper` extra keeps core installable without the application's
# dependencies; this catches the other case -- a pure-stdlib helper drifting
# from astrogwb.paper into core, which no packaging check would ever see.
"astrogwb.paper".msg = "core must not import the paper application; the dependency runs one way (astrogwb.paper -> astrogwb)"

[tool.ruff.lint.per-file-ignores]
# The application itself, its tests, and the scripts and notebooks that drive
# it are the intended importers.
"src/astrogwb/paper/**/*.py" = ["TID251"]
"tests/paper/**/*.py" = ["TID251"]
"scripts/**/*.py" = ["TID251"]
# B018: a bare name on a cell's last line is how a notebook renders a value,
# not a useless expression. DTZ005: run-artifact filenames are stamped with
# local wall-clock time on purpose, so the author recognizes their own runs.
# E402: the Colab bootstrap and configure_runtime must precede JAX imports.
"notebooks/**/*.py" = ["TID251", "B018", "DTZ005", "E402"]
# F811: every marimo cell is `def _`, which Pyflakes reads as a redefinition.
# F401: the setup cell is imports only; later cells are what use those names.
# PLR1711: marimo writes a bare `return` on cells that export nothing.
"notebooks/fiducial_spectrum.py" = ["F811", "F401", "PLR1711"]
"notebooks/spectrum_snrs.py" = ["F811", "F401", "I001", "PLR1711"]
"notebooks/ensemble_spectrum.py" = ["PLR1711"]
"notebooks/cosmology_grid_posteriors.py" = ["PLR1711"]
"notebooks/madau_dickinson_grid.py" = ["PLR1711"]

[tool.ty.src]
# Most of `scripts/` stays absent because fixture generators can import
# heavyweight optional dependencies; Ruff continues to cover every script.
include = [
    "src",
    "tests",
    "notebooks/cosmology_grid_posteriors.py",
    "notebooks/madau_dickinson_grid.py",
]

[tool.pytest.ini_options]
addopts = "-n auto --dist loadscope"
testpaths = ["tests"]
markers = [
    "integration: tests that call external libraries or services (deselect with -m 'not integration')",
]
