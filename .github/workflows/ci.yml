name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv run --group dev ruff check
      - run: uv run --group dev ruff format --check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv run --group dev ty check

  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Verify ORF reference fixtures are present
        run: |
          test -f tests/fixtures/gwfast_orf_reference.npz
          test -f tests/fixtures/gwfast_orf_reference_et_triangle.npz
      - run: uv run --group dev pytest -m "not integration"

  test-integration:
    name: Test integration (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Verify ORF reference fixtures are present
        run: |
          test -f tests/fixtures/gwfast_orf_reference.npz
          test -f tests/fixtures/gwfast_orf_reference_et_triangle.npz
      - run: uv run --group dev pytest -m integration
