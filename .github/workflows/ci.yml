name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run --group dev ruff check
      - run: uv run --group dev ruff format --check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run --group dev ty check

  generate-fixtures:
    name: Generate test fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Cache ORF reference fixtures
        id: cache-fixtures
        uses: actions/cache@v4
        with:
          path: tests/fixtures
          key: orf-fixtures-${{ hashFiles('src/asgwb/detector/overlap.py', 'scripts/generate_orf_fixtures.py') }}
      - name: Generate ORF reference fixtures
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        run: uv run --script scripts/generate_orf_fixtures.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: generate-fixtures
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Restore ORF reference fixtures
        uses: actions/cache@v4
        with:
          path: tests/fixtures
          key: orf-fixtures-${{ hashFiles('src/asgwb/detector/overlap.py', 'scripts/generate_orf_fixtures.py') }}
      - run: uv run --group dev pytest

  test-bilby-integration:
    name: Test bilby integration (Python 3.12)
    runs-on: ubuntu-latest
    needs: generate-fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Restore ORF reference fixtures
        uses: actions/cache@v4
        with:
          path: tests/fixtures
          key: orf-fixtures-${{ hashFiles('src/asgwb/detector/overlap.py', 'scripts/generate_orf_fixtures.py') }}
      - run: uv run --group dev --extra bilby pytest -m integration
