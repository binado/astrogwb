name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run integration tests"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every `run:` below is a `just` recipe, so the command a contributor runs
# locally and the command CI runs are the same string.

jobs:
  check:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just lint
      - run: just typecheck

  test-core:
    name: Core tests (Python 3.12)
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: extractions/setup-just@v4
      - name: Verify reference fixtures are present
        run: |
          test -f tests/core/fixtures/gwfast_orf_reference.npz
          test -f tests/core/fixtures/gwfast_orf_reference_et_triangle.npz
      - run: just test-core

  test-paper:
    name: Paper tests (Python 3.12)
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just test-paper

  test-integration:
    name: Test integration (Python 3.12)
    if: github.event_name == 'workflow_dispatch' && (inputs.run_integration == true || inputs.run_integration == 'true' || inputs.run_integration == null)
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: extractions/setup-just@v4
      - name: Verify reference fixtures are present
        run: |
          test -f tests/core/fixtures/gwfast_orf_reference.npz
          test -f tests/core/fixtures/gwfast_orf_reference_et_triangle.npz
      - run: just test-integration
