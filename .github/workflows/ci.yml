name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run --group dev ruff check
      - run: uv run --group dev ruff format --check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run --group dev ty check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify ORF reference fixtures are present
        run: |
          test -f tests/fixtures/gwfast_orf_reference.npz
          test -f tests/fixtures/gwfast_orf_reference_et_triangle.npz
      - run: uv run --group dev pytest

  test-bilby-integration:
    name: Test bilby integration (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Verify ORF reference fixtures are present
        run: |
          test -f tests/fixtures/gwfast_orf_reference.npz
          test -f tests/fixtures/gwfast_orf_reference_et_triangle.npz
      - run: uv run --group dev --extra bilby pytest -m integration
