name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every `run:` below is a `just` recipe, so the command a contributor runs
# locally and the command CI runs are the same string. The jobs stay separate
# rather than collapsing behind one recipe: that keeps them parallel and keeps
# one independent red/green signal per concern instead of a single verdict.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just typecheck

  test-core:
    name: Core tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - name: Verify reference fixtures are present
        run: |
          test -f packages/astrogwb/tests/fixtures/gwfast_orf_reference.npz
          test -f packages/astrogwb/tests/fixtures/gwfast_orf_reference_et_triangle.npz
          test -f packages/astrogwb/tests/fixtures/mock_bns_population.yaml
          test -f packages/astrogwb/tests/fixtures/mock_bns_population.csv
      - run: just test-core

  test-paper:
    name: Paper tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just test-paper

  test-integration:
    name: Test integration (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - name: Verify reference fixtures are present
        run: |
          test -f packages/astrogwb/tests/fixtures/gwfast_orf_reference.npz
          test -f packages/astrogwb/tests/fixtures/gwfast_orf_reference_et_triangle.npz
          test -f packages/astrogwb/tests/fixtures/mock_bns_population.yaml
          test -f packages/astrogwb/tests/fixtures/mock_bns_population.csv
      - run: just test-integration

  test-notebooks:
    name: Notebooks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      # The notebooks build their own catalogs from an inline population graph,
      # so this job needs no fixture guard: nothing it reads comes from
      # packages/astrogwb/tests. Executing them *is* the assertion.
      - run: just test-notebooks
        env:
          ASTROGWB_NOTEBOOK_SMOKE: "1"

  build-core:
    name: Build publishable core distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v3
      - run: just build-core
      - run: uv venv .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/*.whl
      - name: Smoke-test installed wheel and bundled detector data
        run: >-
          .wheel-venv/bin/python -c
          "import importlib.util; import astrogwb;
          from importlib.metadata import requires;
          from astrogwb.detector import load_detector, load_sensitivity;
          load_detector('H1'); load_sensitivity('H1');
          assert importlib.util.find_spec('astrogwb_paper') is None;
          assert importlib.util.find_spec('astrogwb.config') is None;
          assert importlib.util.find_spec('astrogwb.runtime') is None;
          assert not any(name in requirement.lower()
          for requirement in requires('astrogwb') or []
          for name in ('arviz', 'pydantic', 'astrogwb-paper'))"
