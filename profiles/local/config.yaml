# Local batch profile: run the MCMC batch on this machine (no SLURM), packing
# multiple run_mcmc subprocesses across cores.
#   just dry=0 mcmc-local <batch.json>
#   snakemake --snakefile workflow/mcmc.smk \
#     --profile profiles/local --configfile <batch.json> --cores 8 mcmc
# Uses Snakemake's default local executor -- no executor plugin required.
#
# Two layers of parallelism combine here:
#   * job-level: Snakemake runs floor(--cores / threads) run_mcmc jobs at once;
#   * chain-level: on CPU the runner auto-selects chain_method="parallel" and
#     spreads a run's num_chains over that many logical CPU devices.
# Size --cores against (concurrent jobs) x (cores each job actually uses) so the
# machine is not oversubscribed. For a large sweep, prefer single-chain configs
# and let the job level do the work.

# Force JAX onto CPU so run_mcmc does not try to initialize CUDA on a machine
# with no GPU (overrides the "cuda" default in workflow/mcmc.smk).
config:
  - jax_platforms=cpu

# Account each run_mcmc job at its core footprint so --cores packs jobs
# correctly. On CPU, workflow/mcmc.smk passes rule threads as
# --host-device-count (one logical device per concurrent chain, with
# --cpu-threads pinned to 1) rather than a BLAS/XLA thread cap, so this must
# be >= the run config's [sampler] num_chains.
set-threads:
  - run_mcmc=4

set-resources:
  run_mcmc:
    mem_mb: 8000
    runtime: 720
