# Detector sensitivities, keyed by the public detector name reported by
# gwmock's detector_names(). Plain str codes (H1, L1, ...) match directly;
# gwmock preset CustomDetectors match on their .name (e.g. ET1_SARD).
#
# psd_reference may be a gwmock-noise bundled preset (e.g. "ET_D_psd"), a
# file in astrogwb's noise_curves/ directory, an absolute path, or a URL.
# LAL/CE/Virgo/KAGRA curves are kept local (not bundled upstream).
#
# duty_factor is reference metadata for analysis setup (not loaded into
# Sensitivity); out-of-band PSD masking follows each noise curve file's
# tabulated grid via evaluate_psd().

[detectors.H1]
psd_reference = "AplusDesign_psd.txt"
duty_factor = 0.7

[detectors.L1]
psd_reference = "AplusDesign_psd.txt"
duty_factor = 0.7

[detectors.V1]
psd_reference = "avirgo_O5low_NEW_psd.txt"
duty_factor = 0.7

[detectors.K1]
psd_reference = "kagra_128Mpc_psd.txt"
duty_factor = 0.7

# --- Einstein Telescope: triangle (str E1/E2/E3, geometry.toml) ---
[detectors.E1]
psd_reference = "ET_COBA_10km_psd.txt"
duty_factor = 0.85

[detectors.E2]
psd_reference = "ET_COBA_10km_psd.txt"
duty_factor = 0.85

[detectors.E3]
psd_reference = "ET_COBA_10km_psd.txt"
duty_factor = 0.85

# --- ET L-shaped sites (str S1/S2/R1/R2, geometry.toml) ---
[detectors.S1]
psd_reference = "ET_COBA_15km_psd.txt"
duty_factor = 0.85

[detectors.S2]
psd_reference = "ET_COBA_15km_psd.txt"
duty_factor = 0.85

[detectors.R1]
psd_reference = "ET_COBA_15km_psd.txt"
duty_factor = 0.85

[detectors.R2]
psd_reference = "ET_COBA_15km_psd.txt"
duty_factor = 0.85

# --- Cosmic Explorer (str C1/C2, geometry.toml) ---
[detectors.C1]
psd_reference = "cosmic_explorer_strain_psd.txt"
duty_factor = 0.85

[detectors.C2]
psd_reference = "cosmic_explorer_strain_psd.txt"
duty_factor = 0.85
