# Detector sensitivities, keyed by the public detector name reported by
# gwmock's detector_names(). Plain str codes (H1, L1, ...) match directly;
# gwmock preset CustomDetectors match on their .name (e.g. ET1_SARD).
#
# psd_reference may be a gwmock-noise bundled preset (e.g. "ET_D_psd"), a
# file in astrogwb's noise_curves/ directory, an absolute path, or a URL.
# LAL/CE/Virgo/KAGRA curves are kept local (not bundled upstream).
#
# minimum_frequency, maximum_frequency, and duty_factor are reference metadata
# for analysis setup (not loaded into Sensitivity); out-of-band PSD masking
# follows each noise curve file's tabulated grid via evaluate_psd().

[H1]
psd_reference = "AplusDesign_psd.txt"
minimum_frequency = 20
maximum_frequency = 2048
duty_factor = 0.7

[L1]
psd_reference = "AplusDesign_psd.txt"
minimum_frequency = 20
maximum_frequency = 2048
duty_factor = 0.7

[V1]
psd_reference = "avirgo_O5low_NEW_psd.txt"
minimum_frequency = 20
maximum_frequency = 2048
duty_factor = 0.7

[K1]
psd_reference = "kagra_128Mpc_psd.txt"
minimum_frequency = 20
maximum_frequency = 2048
duty_factor = 0.7

