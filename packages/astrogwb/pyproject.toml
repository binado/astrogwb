[project]
name = "astrogwb"
version = "0.1.0"
description = "Bayesian inference for compact-binary stochastic gravitational-wave backgrounds"
readme = "README.md"
authors = [
    { name = "Bernardo Veronese", email = "bernardopveronese@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "gwmock-noise>=0.10.1",
    "gwmock-pop>=0.11.4",
    "gwmock-signal[jax]>=0.16.3",
    "h5netcdf[h5py]>=1.8.1",
    "jax>=0.10.2; sys_platform == 'linux'",
    "jax[cpu]>=0.11.0; sys_platform != 'linux'",
    "numpy>=2.5.1",
    "numpyro>=0.21.0",
    "xarray>=2025.1",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.11.0"]
tpu = ["jax[tpu]>=0.11.0"]

[project.urls]
Homepage = "https://github.com/binado/astrogwb"
Repository = "https://github.com/binado/astrogwb"
Issues = "https://github.com/binado/astrogwb/issues"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
test = ["pytest>=9.0.2", "pytest-xdist>=3.8.0"]
