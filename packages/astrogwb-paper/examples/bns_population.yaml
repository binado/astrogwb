# BNS population for the importance-sampling waveform catalog.
#
# Consumed by `gwmock-pop simulate` (see docs/catalog-generation.md). Each
# entry is either a `sampler` (the engine injects the PRNG `key` and `n_samples`)
# or a `transform` (derives values from other parameters, referenced as `@name`).
#
# Parameter names are gwmock-pop *canonical* names. Most map directly onto what
# the downstream waveform backend (`gwmock_signal.waveform.RippleBackend`)
# consumes: `luminosity_distance`, `spin_1z/2z`, `lambda_1/2`, `inclination`,
# `coa_phase`. Omitted optional parameters (e.g. the in-plane spin components)
# default to zero in the backend. The exception is the masses: this file emits
# *source-frame* `source_frame_mass_1/2`, which the catalog-build step converts
# to the backend's `detector_frame_mass_1/2` via `* (1 + z)` (see below).
parameters:
  # 1) Madau-Dickinson redshift distribution.
  #    Cosmology (flat-LambdaCDM) matches the MCMC fiducials in
  #    packages/astrogwb-paper/configs/mcmc/fragments/base.toml and configs/paper.toml: H0 = 67.66 km/s/Mpc,
  #    Omega_m = 0.3096. The values are anchored here and reused by the
  #    distance transform below (via YAML aliases) so the two stages cannot
  #    drift apart.
  redshift:
    sampler:
      function: madau_dickinson_redshift
      arguments:
        z_min: 0.0
        z_max: &z_max 20.0
        # Rate-evolution shape parameters (Madau–Dickinson fiducials).
        gamma: 1.42
        kappa: 4.62
        z_peak: 1.84
        hubble_constant: &hubble_constant 67.66
        omega_m: &omega_m 0.3096

  # 2) Redshift -> luminosity distance (flat-LambdaCDM lookup, Mpc). Same
  #    cosmology as the redshift sampler (aliased from the anchors above).
  #    `max_redshift` is aliased to `z_max` so the lookup grid covers the full
  #    sampled range; otherwise gwmock-pop's default (max_redshift=10.0) would
  #    silently clamp the distance of any z > 10 event to d_L(z=10).
  luminosity_distance:
    transform:
      function: redshift_to_luminosity_distance
      arguments:
        redshift: "@redshift"
        hubble_constant: *hubble_constant
        omega_m: *omega_m
        max_redshift: *z_max

  # 3) Uniform component masses, in the *source frame* (solar masses), ordered
  #    so mass_1 >= mass_2. `joint_uniform_mass_pair` returns a (2, n) stack
  #    (row 0 = larger, row 1 = smaller); `take_row` splits it into the two
  #    columns. The pair is marked `intermediate` so only the split columns are
  #    written to the output file.
  #
  #    NOTE: the waveform backend consumes *detector-frame* masses. The
  #    source -> detector conversion (detector = source * (1 + z)) is applied at
  #    catalog-build time, in the step that loads this population and calls
  #    `generate_catalog_polarization_power`.
  mass_pair:
    intermediate: true
    sampler:
      function: joint_uniform_mass_pair
      arguments:
        m1_min: 1.0
        m1_max: 2.5
        m2_min: 1.0
        m2_max: 2.5
        ordered: true
  source_frame_mass_1:
    transform:
      function: take_row
      arguments:
        matrix: "@mass_pair"
        index: 0
  source_frame_mass_2:
    transform:
      function: take_row
      arguments:
        matrix: "@mass_pair"
        index: 1

  # 4) Aligned spins: only the z-components are sampled; the in-plane components
  #    are left unset and default to zero, which is what "aligned" means (an
  #    aligned-spin approximant rejects nonzero in-plane spins).
  spin_1z:
    sampler:
      function: uniform
      arguments:
        minimum: -0.05
        maximum: 0.05
  spin_2z:
    sampler:
      function: uniform
      arguments:
        minimum: -0.05
        maximum: 0.05

  # 5) Uniform tidal deformabilities (dimensionless; require an NRTidal/TaylorF2
  #    approximant downstream, and must be >= 0).
  lambda_1:
    sampler:
      function: uniform
      arguments:
        minimum: 0.0
        maximum: 2000.0
  lambda_2:
    sampler:
      function: uniform
      arguments:
        minimum: 0.0
        maximum: 2000.0

  # 6) Inclination fixed at 0.
  inclination:
    transform:
      function: constant_like
      arguments:
        reference: "@redshift"
        value: 0.0

  # 7) Coalescence phase and time fixed at 0.
  coa_phase:
    transform:
      function: constant_like
      arguments:
        reference: "@redshift"
        value: 0.0
  coa_time:
    transform:
      function: constant_like
      arguments:
        reference: "@redshift"
        value: 0.0
