# Settings shared by every curated experiment run. Each
# experiments/<experiment>.toml file supplies detector networks, sampled
# parameters, and any run-specific likelihood or prior overrides.

seed = 42
observation_time = 1.0

[analysis]
f_min = 2.0
f_max = 4096.0

[cosmology]
z_min = 0.0
z_max = 20.0
n_grid = 256

[sampler]
num_warmup = 2000
num_samples = 2000
num_chains = 4
target_accept = 0.9
dense_mass = true
max_tree_depth = 10
forward_mode_differentiation = false
progress_bar = true
jit_model_args = true

[fiducials]
H0 = 67.66
Omega_m = 0.3096
xi_0 = 1.0
xi_n = 1.91
gamma = 1.42
kappa = 4.62
z_peak = 1.84
local_merger_rate = 161.0

[priors.H0]
type = "uniform"
low = 20.0
high = 140.0

[priors.Omega_m]
type = "normal"
loc = 0.3096
scale = 0.006

[priors.xi_0]
type = "uniform"
low = 0.5
high = 5.0

[priors.xi_n]
type = "uniform"
low = 0.3
high = 3.0

[priors.gamma]
type = "uniform"
low = -10.0
high = 10.0

[priors.kappa]
type = "uniform"
low = -10.0
high = 10.0

[priors.z_peak]
type = "uniform"
low = 0.0
high = 2.5

[priors.local_merger_rate]
type = "normal"
loc = 161.0
scale = 1.61

[output]
outdir = "outputs/chains"
label = ""
