# Presentation labels for the detector networks compared across figures.
#
# This registry owns the label only. Each network's detector list stays in
# experiments/<experiment>.toml under [runs.<network>.analysis].detectors and
# is resolved through astrogwb_paper.config.figures.resolve_networks, so a
# network name, its label, and its detectors can never drift apart.

[labels]
"ET-triangular" = 'ET-$\Delta$'
"ET-triangular-CE-Hanford" = 'ET-$\Delta$ $+$ CE'
"ET-2L-aligned" = "ET-2L-par"
"ET-2L-aligned-CE-Hanford" = 'ET-2L-par $+$ CE'
"ET-2L-misaligned" = "ET-2L"
"ET-2L-misaligned-CE-Hanford" = 'ET-2L $+$ CE'
