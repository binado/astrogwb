# Fiducial spectrum and effective-PSD panels. These compare the same six
# networks as the H0-all-detectors experiment, so they borrow its detector
# lists rather than restating them; labels come from detector-networks.toml.

experiment = "H0-all-detectors"
networks = [
    "ET-triangular",
    "ET-triangular-CE-Hanford",
    "ET-2L-aligned",
    "ET-2L-aligned-CE-Hanford",
    "ET-2L-misaligned",
    "ET-2L-misaligned-CE-Hanford",
]
# Lower y-limit for Omega_GW; the S_h ymin is taken from S_h at the frequency
# where Omega_GW is closest to this floor.
omega_gw_min = 1.0e-15
