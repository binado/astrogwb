base:
  population:
    base_config: inputs/populations/population.base.yaml
    md_redshift_config: inputs/populations/population.md.yaml
    uniform_redshift_config: inputs/populations/population.uniform-redshift.yaml
  waveform:
    approximant: IMRPhenomXAS_NRTidalv3
    sampling_frequency: 8192.0
    minimum_frequency: 2.0
    maximum_frequency: 4096.0
    reference_frequency: 20.0
    frequency_resolution: 1.0
    chunk_size: 2048

banks:
  md-imrphenom-s41:
    component: md
    num_samples: 32768
    seed: 41
  md-imrphenom-s42:
    component: md
    num_samples: 32768
    seed: 42
  md-taylorf2-s41:
    component: md
    num_samples: 32768
    seed: 41
    waveform:
      approximant: TaylorF2
  uniform-imrphenom-s51:
    component: uniform-redshift
    num_samples: 8192
    seed: 51

catalogs:
  injection-bns-n32768-eps=0-df1:
    md_bank: md-imrphenom-s41
    num_samples: 32768
  bns-n32768-eps=0-df1-taylorf2:
    md_bank: md-taylorf2-s41
    num_samples: 32768
  bns-n8192-eps=0-df1:
    md_bank: md-imrphenom-s42
    num_samples: 8192
  bns-n16384-eps=0-df1:
    md_bank: md-imrphenom-s42
    num_samples: 16384
  bns-n32768-eps=0-df1:
    md_bank: md-imrphenom-s42
    num_samples: 32768
  bns-n16384-eps=0.1-df1:
    md_bank: md-imrphenom-s42
    uniform_bank: uniform-imrphenom-s51
    num_samples: 16384
    uniform_mixing_fraction: 0.1
    mixture_seed: 61
  bns-n16384-eps=0.01-df1:
    md_bank: md-imrphenom-s42
    uniform_bank: uniform-imrphenom-s51
    num_samples: 16384
    uniform_mixing_fraction: 0.01
    mixture_seed: 62
  bns-n16384-eps=0.001-df1:
    md_bank: md-imrphenom-s42
    uniform_bank: uniform-imrphenom-s51
    num_samples: 16384
    uniform_mixing_fraction: 0.001
    mixture_seed: 63
