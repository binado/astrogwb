base:
  production:
    operation: mixture
    seed: 142
    components:
      - source: proposal-fiducial
        weight: 0.8
      - source: proposal-uniform-redshift
        weight: 0.2
    uniform_redshift_fraction: 0.2
  waveform:
    approximant: IMRPhenomXAS_NRTidalv3
    sampling_frequency: 8192.0
    minimum_frequency: 2.0
    maximum_frequency: 4096.0
    reference_frequency: 20.0
    frequency_resolution: 1.0
    chunk_size: 2048

sources:
  injection-fiducial:
    config: examples/bns_population.yaml
    num_samples: 32768
    seed: 41
  proposal-fiducial:
    config: examples/bns_population.yaml
    num_samples: 32768
    seed: 42
  proposal-uniform-redshift:
    config: examples/bns_population_uniform_redshift.yaml
    num_samples: 32768
    seed: 43

injection:
  production:
    operation: identity
    num_samples: 32768
    seed: 141
    uniform_redshift_fraction: null
    components:
      - source: injection-fiducial

catalogs:
  bns-n8192-df1:
    production:
      num_samples: 8192
  bns-n16384-df1:
    production:
      num_samples: 16384
  bns-n32768-df1:
    production:
      num_samples: 32768
