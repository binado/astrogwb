[project]
name = "astrogwb-paper"
version = "0.1.0"
description = "Reproducibility workflows for the astrogwb research project"
readme = "README.md"
authors = [
    { name = "Bernardo Veronese", email = "bernardopveronese@gmail.com" },
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "arviz[h5netcdf]>=1.2.0",
    "astrogwb>=0.1.0",
    "gwmock-pop>=0.11.4",
    "gwmock-signal[jax]>=0.16.3",
    "jax>=0.10.2; sys_platform == 'linux'",
    "jax[cpu]>=0.11.0; sys_platform != 'linux'",
    "numpy>=2.5.1",
    "numpyro>=0.21.0",
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cuda = ["astrogwb[cuda]>=0.1.0"]
tpu = ["astrogwb[tpu]>=0.1.0"]
notebook = [
    "arviz>=1.2.0",
    "arviz-base>=1.2.0",
    "arviz-plots>=1.2.0",
    "arviz-stats[xarray]>=1.2.0",
    "corner @ git+https://github.com/dfm/corner.py@d9c1219dfbe6cfe02b3bfd8768428e5e7c88b3f4",
    "h5netcdf>=1.8.1",
    "ipykernel>=7.3.0",
    "jinja2>=3.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pandas>=2.0",
    "scipy>=1.10",
    "xarray>=2025.1",
]

[project.scripts]
astrogwb-run-mcmc = "astrogwb_paper.cli.run_mcmc:main"
astrogwb-assemble-config = "astrogwb_paper.cli.assemble_config:main"
astrogwb-generate-bank = "astrogwb_paper.cli.generate_bank:main"
astrogwb-profile-model = "astrogwb_paper.cli.profile_model:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
plotting = [
    "arviz>=1.2.0",
    "arviz-base>=1.2.0",
    "arviz-plots>=1.2.0",
    "arviz-stats[xarray]>=1.2.0",
    "corner @ git+https://github.com/dfm/corner.py@d9c1219dfbe6cfe02b3bfd8768428e5e7c88b3f4",
    "h5netcdf>=1.8.1",
    "jinja2>=3.1",
    "matplotlib>=3.11.1",
    "pandas>=2.0",
    "scipy>=1.10",
    "xarray>=2025.1",
]
workflow = ["snakemake>=9.24.0"]
test = ["pytest>=9.0.2", "pytest-xdist>=3.8.0"]
dev = [
    { include-group = "plotting" },
    { include-group = "test" },
    { include-group = "workflow" },
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]
slurm = [
    { include-group = "dev" },
    "snakemake-executor-plugin-slurm>=1.5",
]
