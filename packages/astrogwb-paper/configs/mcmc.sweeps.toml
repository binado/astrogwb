# Declarative MCMC sweep campaigns.
#
# Each [runs.*] table expands the Cartesian product of its named networks,
# analyses, and observations into one run per point. The names refer to
# fragment files under configs/mcmc/fragments/; workflow/mcmc.smk merges
# them with `knf` and validates the result, so a name with no matching
# fragment fails as a missing input rather than a dangling reference.

[runs.cosmology]
networks = ["ET-2L-aligned", "ET-2L-aligned-CE-Hanford"]
analyses = ["H0", "H0-Omega_m", "H0-merger-rate-gauss"]
observations = ["baseline"]

[runs.cosmology-all-detectors]
networks = [
    "ET-triangular",
    "ET-triangular-CE-Hanford",
    "ET-2L-aligned",
    "ET-2L-aligned-CE-Hanford",
    "ET-2L-misaligned",
    "ET-2L-misaligned-CE-Hanford",
]
analyses = ["H0", "H0-Omega_m", "H0-merger-rate-gauss"]
observations = ["baseline"]

[runs.modified-propagation-all-detectors]
networks = [
    "ET-triangular",
    "ET-triangular-CE-Hanford",
    "ET-2L-aligned",
    "ET-2L-aligned-CE-Hanford",
    "ET-2L-misaligned",
    "ET-2L-misaligned-CE-Hanford",
]
analyses = ["Xi_0", "Xi_0-n", "Xi_0-H0-gauss"]
observations = ["baseline"]

[runs.astrophysical]
networks = ["ET-2L-aligned", "ET-2L-aligned-CE-Hanford"]
analyses = ["H0-peak", "H0-MD"]
observations = ["baseline"]

[runs.astrophysical-all-detectors]
networks = [
    "ET-triangular",
    "ET-triangular-CE-Hanford",
    "ET-2L-aligned",
    "ET-2L-aligned-CE-Hanford",
    "ET-2L-misaligned",
    "ET-2L-misaligned-CE-Hanford",
]
analyses = ["H0-peak", "H0-MD"]
observations = ["baseline"]
