# Two-parameter cosmology config (H0 + Omega_m). Mirrors mcmc.example.toml but
# samples two hyperparameters, e.g. to compare forward- vs reverse-mode AD cost.

seed = 42
observation_time = 1.0

sampled_params = ["H0", "Omega_m"]

[analysis]
detectors = ["S1", "R1", "C1"]
f_min = 2.0
f_max = 4096.0

[cosmology]
z_min = 0.0
z_max = 20.0
n_grid = 256

[sampler]
num_warmup = 2000
num_samples = 2000
num_chains = 4
target_accept = 0.9
dense_mass = true
max_tree_depth = 10
forward_mode_differentiation = true
progress_bar = true
jit_model_args = true

[fiducials]
H0 = 67.66
Omega_m = 0.3096
xi_0 = 1.0
xi_n = 1.91
gamma = 1.42
kappa = 4.62
z_peak = 1.84
local_merger_rate = 161.0

[priors.H0]
type = "uniform"
low = 20.0
high = 140.0

[priors.Omega_m]
type = "normal"
loc = 0.3096
scale = 0.006

[output]
outdir = "chains"
label = ""
