[paths]
figures_dir = "figures"
chains_dir = "chains"

[analysis]
observation_time = 1.0
f_min = 2.0
f_max = 4096.0

[analysis.cosmology]
z_min = 0.0
z_max = 20.0
n_grid = 256

[analysis.fiducials]
H0 = 67.66
Omega_m = 0.3096
xi_0 = 1.0
xi_n = 1.91
gamma = 1.42
kappa = 4.62
z_peak = 1.84
local_merger_rate = 161.0
importance_relative_ess = 1.0

[detector_networks]
"ET-triangular" = ["E1", "E2", "E3"]
"ET-triangular-CE-Hanford" = ["E1", "E2", "E3", "C1"]
"ET-2L-aligned" = ["S1", "R1"]
"ET-2L-aligned-CE-Hanford" = ["S1", "R1", "C1"]
"ET-2L-misaligned" = ["S2", "R2"]
"ET-2L-misaligned-CE-Hanford" = ["S2", "R2", "C1"]

[figures.mcmc_cosmological_parameters]
# Snakemake resolves these logical cosmology runs to concrete chain inputs. Direct
# notebook runs can replace both ordered path lists and their labels through CLI.
campaign = "cosmology-all-detectors"
detector_analysis = "H0"
prior_network = "ET-2L-aligned-CE-Hanford"
omega_m_analysis = "H0-Omega_m"

[figures.mcmc_cosmological_parameters.detector_ax_kwargs]
xlabel = '$H_0 \ [\mathrm{km \ s^{-1} \ Mpc^{-1}}]$'
ylabel = "Posterior density"

[figures.mcmc_cosmological_parameters.detector_legend_kwargs]
ncol = 3
loc = "lower center"
bbox_to_anchor = [0.5, 1.02]
frameon = false
borderaxespad = 0
handlelength = 2.5

[figures.mcmc_cosmological_parameters.prior_ax_kwargs]
xlabel = '$H_0 \ [\mathrm{km \ s^{-1} \ Mpc^{-1}}]$'
ylabel = "Posterior density"

[figures.mcmc_cosmological_parameters.prior_legend_kwargs]
loc = "best"
frameon = false

[figures.mcmc_cosmological_parameters.corner_legend_kwargs]
loc = "upper right"
frameon = false

[[figures.mcmc_cosmological_parameters.detector_posteriors]]
network = "ET-triangular"
label = 'ET-$\Delta$'

[[figures.mcmc_cosmological_parameters.detector_posteriors]]
network = "ET-triangular-CE-Hanford"
label = 'ET-$\Delta$ $+$ CE'

[[figures.mcmc_cosmological_parameters.detector_posteriors]]
network = "ET-2L-aligned"
label = "ET-2L-par"

[[figures.mcmc_cosmological_parameters.detector_posteriors]]
network = "ET-2L-aligned-CE-Hanford"
label = 'ET-2L-par $+$ CE'

[[figures.mcmc_cosmological_parameters.detector_posteriors]]
network = "ET-2L-misaligned"
label = "ET-2L"

[[figures.mcmc_cosmological_parameters.detector_posteriors]]
network = "ET-2L-misaligned-CE-Hanford"
label = 'ET-2L $+$ CE'

[[figures.mcmc_cosmological_parameters.prior_posteriors]]
analysis = "H0"
label = '$H_0$ (fixed $\mathcal{R}_0$)'

[[figures.mcmc_cosmological_parameters.prior_posteriors]]
analysis = "H0-merger-rate-gauss"
label = '$H_0 + \mathcal{R}_0$ (narrow prior)'

[figures.mcmc_modified_propagation]
# Snakemake resolves these logical modified-propagation runs to concrete chain
# inputs. Direct notebook runs can replace both ordered path lists and their
# labels through CLI.
campaign = "modified-propagation-all-detectors"
network = "ET-2L-aligned-CE-Hanford"
xi0_analysis = "Xi_0"
xi0_n_analysis = "Xi_0-n"
h0_analysis = "Xi_0-H0-gauss"
marginal_labels = ['$\Xi_0$', '$\Xi_0 + n$', '$\Xi_0 + H_0$']
h0_labels = ['$\Xi_0 + H_0$']

[[figures.mcmc_modified_propagation.detector_posteriors]]
network = "ET-triangular"
label = 'ET-$\Delta$'

[[figures.mcmc_modified_propagation.detector_posteriors]]
network = "ET-triangular-CE-Hanford"
label = 'ET-$\Delta$ $+$ CE'

[[figures.mcmc_modified_propagation.detector_posteriors]]
network = "ET-2L-aligned"
label = "ET-2L-par"

[[figures.mcmc_modified_propagation.detector_posteriors]]
network = "ET-2L-aligned-CE-Hanford"
label = 'ET-2L-par $+$ CE'

[[figures.mcmc_modified_propagation.detector_posteriors]]
network = "ET-2L-misaligned"
label = "ET-2L"

[[figures.mcmc_modified_propagation.detector_posteriors]]
network = "ET-2L-misaligned-CE-Hanford"
label = 'ET-2L $+$ CE'
