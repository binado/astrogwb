# Concrete example for astrogwb-run-mcmc -- the headless NumPyro MCMC runner.
# This file is independently runnable and is not the sweep generator's base;
# declarative sweeps use packages/astrogwb-paper/configs/mcmc.base.toml instead.

seed = 42
observation_time = 1.0       # [yr]; cancels in S_h, kept for the likelihood scale

# Parameters to infer. Each must have a [priors.<name>] table and a [fiducials]
# entry. Everything else in [fiducials] is held fixed as a constant.
# (Optional: omit this key to default to every parameter present in [priors].)
sampled_params = ["H0"]

[analysis]
detectors = ["S1", "R1", "C1"]   # resolved via bundled geometry.toml / sensitivity.toml
f_min = 2.0                 # analysis band low edge [Hz]
f_max = 4096.0                # analysis band high edge [Hz]

# Default likelihood samples every entry in [priors] with NUTS. To instead
# integrate one strictly multiplicative parameter out analytically (removes
# the amplitude--shape degeneracy NUTS handles worst), switch to:
#
#   likelihood = "amplitude_marginalized"
#   amplitude_parameter = "H0"          # or "local_merger_rate"
#   amplitude_num_nodes = 1024          # quadrature grid resolution
#   amplitude_prior_span_sigma = 10.0   # Normal-prior grid half-width, in sigma
#
# `amplitude_parameter` still needs a [priors.<name>] table and a
# [fiducials] entry (below), but must NOT also appear in `sampled_params` --
# it is marginalized, not sampled. The resulting chain carries no
# `log_likelihood` group (so az.loo/az.waic do not apply), but gains the
# physical parameter itself, `total_merger_rate`, and
# `quadrature_effective_nodes`; see docs/running-inference.md. Because the
# saved chain then holds one more parameter than the sampler had a latent for,
# use `RunConfig.posterior_params` (not `sampled_params`) whenever you are
# describing the chain -- plot `var_names`, summaries, run records.

[cosmology]
z_min = 0.0
z_max = 20.0                 # must bracket all catalog redshifts (importance-weight requirement)
n_grid = 256                # grid points for cosmology integrals / MD normalization

[sampler]
num_warmup = 2000
num_samples = 2000
num_chains = 4
target_accept = 0.9
dense_mass = true
max_tree_depth = 10
forward_mode_differentiation = true   # Julia used ForwardDiff; grid integrals are fwd-friendly
progress_bar = true
jit_model_args = true

[fiducials]
# The proposal catalog's parameter point. Julia Xi_0 -> xi_0, Xi_n -> xi_n
# (GR is xi_0=1, xi_n=0). Madau–Dickinson shape: gamma, kappa, z_peak.
H0 = 67.66
Omega_m = 0.3096
xi_0 = 1.0
xi_n = 1.91
gamma = 1.42
kappa = 4.62
z_peak = 1.84
local_merger_rate = 770.0    # [Gpc^-3 yr^-1]

# Priors: one [priors.<param>] table per sampled parameter.
# Supported types: uniform (low/high), normal (loc/scale).
[priors.H0]
type = "uniform"
low = 20.0
high = 140.0

# Add more to sample further parameters, e.g.:
# [priors.Omega_m]
# type = "uniform"
# low = 0.05
# high = 0.95

[output]
outdir = "chains"
label = ""                   # blank -> auto name: mcmc-<params>-det=<dets>-seed<seed>-<timestamp>
