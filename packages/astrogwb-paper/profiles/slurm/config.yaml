# MCMC profile:
#   snakemake --snakefile workflow/mcmc.smk \
#     --profile profiles/slurm H0_all_detectors --dry-run
# Requires `uv sync --package astrogwb-paper --extra cuda --group slurm`.
# Job logs land under .snakemake/slurm_logs/.
executor: slurm
# GPUs are scarce relative to CPU cores; size jobs to the actual batch
# (~10 concurrent run_mcmc instances) instead of reusing the CPU profile's
# cap, since --jobs bounds how many DAG-eligible instances the array-jobs
# batcher can bundle into a single sbatch array submission at once.
jobs: 12
# Config assembly and figures are local rules on the submit host.
local-cores: 2
# Batch run_mcmc jobs into one SLURM job array per resource footprint
# (parity with the retired sbatch --array flow).
slurm-array-jobs: run_mcmc
set-threads:
  - run_mcmc=4
set-resources:
  run_mcmc:
    slurm_partition: gpu
    gpu: 1
    # cpus_per_gpu (not cpus_per_task) ties CPU allocation to the GPU so the
    # job isn't CPU-starved on shared nodes. sbatch rejects --cpus-per-task
    # together with --cpus-per-gpu, but the plugin only emits --cpus-per-task
    # from an explicit `cpus_per_task` resource, not from set-threads above,
    # so this is safe to combine with set-threads.
    cpus_per_gpu: 4
    mem_mb: 8000
    runtime: 720
